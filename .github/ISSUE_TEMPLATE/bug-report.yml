name: Documentation or validation bug
description: Report a broken link, inaccurate instruction, or failing repository check.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong and where does it occur?
      placeholder: Include the file path and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Which exact commands or steps reproduce the problem?
      placeholder: Paste the smallest reproducible command sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should the repository or validator do instead?
      placeholder: Describe the expected result and any relevant evidence.
    validations:
      required: true
